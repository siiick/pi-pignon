name: Release

# Run from the Actions tab. Bumps the version, turns the changelog's
# "Unreleased" section into the release notes, runs every check, then pushes
# the release commit and tag, stages the package on npm (trusted publishing,
# with provenance) and creates the GitHub release. The package goes live once
# a maintainer approves it with 2FA: `npm stage approve` or npmjs.com.
#
# "retry" releases main's current version from its tag, for a run that pushed
# the tag but failed to publish: nothing is bumped, committed or pushed.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major, retry]
        default: patch
      dry_run:
        description: Dry run (prepare and check the release; push and publish nothing)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release (${{ inputs.bump }}${{ inputs.dry_run && ', dry run' || '' }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the release commit and tag, create the GitHub release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No dependency cache: a release should not restore state other runs wrote.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check npm supports staged publishing (11.15.0 or later)
        run: |
          required=11.15.0
          actual=$(npm --version)
          if [ "$(printf '%s\n' "$required" "$actual" | sort -V | head -n 1)" != "$required" ]; then
            echo "::error::npm $actual cannot stage packages (needs $required or later)"
            exit 1
          fi

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" = retry ]; then
            version=v$(node -p 'require("./package.json").version')
            if ! git fetch --quiet --depth=1 origin "refs/tags/$version:refs/tags/$version"; then
              echo "::error::No $version tag: retry only releases a version an earlier run tagged"
              exit 1
            fi
            # With this script, before the tag's older copy replaces it.
            node scripts/release.ts --notes-only "$RUNNER_TEMP/notes.md"
            git checkout --quiet "$version"
          else
            version=$(npm version "$BUMP" --no-git-tag-version)
          fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Update changelog and README
        if: ${{ inputs.bump != 'retry' }}
        run: node scripts/release.ts "$RUNNER_TEMP/notes.md"

      - name: Check
        run: npm run check
        env:
          # The worker tests use the runner's Python, not a local worker/.venv.
          PYTHON: python

      - name: Commit and tag
        if: ${{ inputs.bump != 'retry' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "chore: release $VERSION"
          git tag --annotate "v$VERSION" --message "pi-pignon $VERSION"
          git show --stat HEAD
          echo "--- Release notes ---"
          cat "$RUNNER_TEMP/notes.md"

      # Atomic: fails without pushing anything if main moved during the run.
      - name: Push
        if: ${{ !inputs.dry_run && inputs.bump != 'retry' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git push --atomic origin HEAD:main "v$VERSION"

      # The checks already ran above: skip prepublishOnly. The trusted
      # publisher only allows staging, so nothing goes live without 2FA.
      - name: Stage on npm
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm stage publish . --provenance --ignore-scripts
          {
            echo "### pi-pignon $VERSION is staged on npm"
            echo
            echo "It goes live once approved with 2FA, on npmjs.com (Staged Packages tab) or with:"
            echo
            echo '```bash'
            echo "npm stage list pi-pignon"
            echo "npm stage approve <stage-id>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage on npm (dry run)
        if: ${{ inputs.dry_run }}
        run: npm stage publish . --provenance --ignore-scripts --dry-run

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        # Skipped when a retry finds the release already made.
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "The v$VERSION release already exists"
            exit 0
          fi
          gh release create "v$VERSION" --verify-tag --title "pi-pignon $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
